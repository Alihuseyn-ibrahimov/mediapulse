<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel — Giriş</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #1e3a5f 0%, #2d5a9e 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: white;
      border-radius: 20px;
      padding: 48px 40px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 24px 60px rgba(0,0,0,.25);
      text-align: center;
    }
    .logo {
      font-size: 22px;
      font-weight: 800;
      color: #1e3a5f;
      margin-bottom: 8px;
    }
    .logo span { color: #3b82f6; }
    .subtitle {
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 36px;
    }
    .lock-icon {
      font-size: 48px;
      margin-bottom: 20px;
      display: block;
    }
    label {
      display: block;
      text-align: left;
      font-size: 13px;
      font-weight: 600;
      color: #374151;
      margin-bottom: 6px;
    }
    input[type=password] {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #e5e7eb;
      border-radius: 10px;
      font-size: 16px;
      letter-spacing: 4px;
      outline: none;
      transition: border-color .2s;
      margin-bottom: 8px;
    }
    input[type=password]:focus { border-color: #1e3a5f; }
    .error {
      background: #fef2f2;
      color: #dc2626;
      border: 1px solid #fca5a5;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      margin-bottom: 16px;
      text-align: left;
    }
    button[type=submit] {
      width: 100%;
      background: #1e3a5f;
      color: white;
      border: none;
      padding: 13px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
      transition: background .2s;
    }
    button[type=submit]:hover { background: #2d5a9e; }
    .back {
      display: block;
      margin-top: 20px;
      font-size: 13px;
      color: #94a3b8;
      text-decoration: none;
    }
    .back:hover { color: #1e3a5f; }
  </style>
</head>
<body>
  <div class="card">
    <span class="lock-icon">🔐</span>
    <div class="logo">Media<span>Pulse</span></div>
    <div class="subtitle">Admin Panel — Giriş</div>

    {% if error %}
    <div class="error">⚠️ {{ error }}</div>
    {% endif %}

    <form method="post">
      {% csrf_token %}
      <input type="hidden" name="action" value="login">
      <label for="code">Giriş kodu</label>
      <input type="password" id="code" name="code" placeholder="••••••••" autofocus>
      <button type="submit">Daxil ol →</button>
    </form>
    <a href="/" class="back">← Ana səhifəyə qayıt</a>
  </div>
</body>
</html>
